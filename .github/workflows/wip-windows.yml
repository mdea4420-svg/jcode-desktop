name: WIP Windows build

on:
  push:
    branches: [wip]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: wip-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: "0.6.5"
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: jcode-desktop
          fetch-depth: 0
      - name: Find the pinned Jcode runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          ref=$(python - <<'EOF'
          import re
          text = open("jcode-desktop/.github/workflows/cross-platform-release.yml", encoding="utf-8").read()
          print(re.search(r"repository: 1jehuang/jcode\s*\n\s*ref: ([0-9a-f]{40})", text).group(1))
          EOF
          )
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 1jehuang/jcode
          ref: ${{ steps.runtime.outputs.ref }}
          path: jcode
          submodules: recursive
      - name: Configure MSVC build environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - name: Disable POSIX rustc wrapper
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_BUILD_RUSTC_WRAPPER='
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: jcode-desktop
          cache-on-failure: true
          key: fork-${{ env.TARGET }}
      - name: Verify tests and build jcode-desktop.exe
        working-directory: jcode-desktop
        shell: pwsh
        env:
          JCODE_DESKTOP_VERSION: ${{ env.VERSION }}
          JCODE_DESKTOP_FORK: "1"
        run: |
          cargo test --release --target $env:TARGET -p jcode-plugins
          if ($LASTEXITCODE) { throw 'jcode-plugins tests failed' }
          cargo check --tests --target $env:TARGET -p jcode-desktop-ui --message-format short
          if ($LASTEXITCODE) { throw 'jcode-desktop-ui --tests typecheck failed' }
          cargo build --release --target $env:TARGET --bin jcode-desktop
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/jcode-desktop.exe" "dist/jcode-desktop-zh-cn.exe"
          $hash = (Get-FileHash "dist/jcode-desktop-zh-cn.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  jcode-desktop-zh-cn.exe" | Set-Content dist/SHA256SUMS
          Write-Host "Built jcode-desktop-zh-cn.exe SHA256=$hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jcode-desktop-wip-windows
          path: jcode-desktop/dist/*
          if-no-files-found: error
