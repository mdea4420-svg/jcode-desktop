[package]
name = "jcode-plugins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Plugin packages for Jcode: discovery, slash commands, hook dispatch and config sync"

# GPUI-free on purpose: the CLI is also the hook dispatcher that jcode spawns
# on tool calls, so it must start fast, and the logic tests in about a second.
[lib]
path = "src/lib.rs"

[[bin]]
name = "jcode-plugins"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
shlex = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
